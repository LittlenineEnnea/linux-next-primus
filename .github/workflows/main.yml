name: Build ARM64 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc \
                              git ccache qemu-user-static
          sudo apt install -y libncurses5-dev
          sudo apt install -y gcc-aarch64-linux-gnu
          ccache -M 10G

      - name: Print system info
        run: |
          uname -a
          echo "Using CROSS_COMPILE=${CROSS_COMPILE}"
          ccache -s

      - name: Clean and configure kernel
        run: |
          make mrproper
          make -j$(nproc) ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} -o=out defconfig

      - name: Build kernel
        run: |
          make -j$(nproc) ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} -o=out Image dtbs modules

      - name: List output files
        run: |
          echo "Output directory:"
          ls -lh out

      - name: Zip output
        run: |
          if [ -d out ]; then
            zip -r out.zip out/
          else
            echo "Error: out/ directory not found!"
            ls -l
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: out.zip
