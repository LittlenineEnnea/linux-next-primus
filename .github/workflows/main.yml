name: Build ARM64 Linux Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc \
                              git ccache qemu-user-static
          sudo apt install -y libncurses5-dev
          sudo apt install -y gcc-aarch64-linux-gnu
          ccache -M 10G

      - name: Show toolchain info
        run: |
          aarch64-linux-gnu-gcc --version
          ccache -s

      - name: Kernel clean + defconfig
        run: |
          make mrproper
          make O=out ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} defconfig

      - name: Build Kernel (Image, dtbs, modules)
        run: |
          make -j$(nproc) O=out ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} Image dtbs modules

      - name: Check output directory
        run: |
          echo "Listing out/:"
          ls -R out

      - name: Package kernel outputs
        run: |
          mkdir -p kernel_output
          cp -v out/arch/arm64/boot/Image kernel_output/
          cp -v out/arch/arm64/boot/dts/*.dtb kernel_output/ 2>/dev/null || true
          cp -vr out/arch/arm64/boot/dts/ kernel_output/dtbs || true
          cp -vr out/lib/modules/ kernel_output/modules || true

          cd kernel_output
          zip -r ../kernel_build.zip . --no-follow-symlinks

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-kernel-output
          path: kernel_build.zip
